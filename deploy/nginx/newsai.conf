# ─────────────────────────────────────────────────────────────────────────────
# Article product (newsai) — prod nginx vhost TEMPLATE.
#
# Studio paths are denied (404) for hard API-level enforcement of the client trial.
# Serves the article-only React build and proxies article API/admin/static/media to
# the newsai django upstream.
#
# DEPLOY STEPS (do NOT edit-in-place on this repo copy):
#   1. Replace every REPLACE_ROOT with the real root domain (e.g. example.com).
#   2. Issue certs for newsai.<root> AND *.newsai.<root>. The wildcard REQUIRES a
#      DNS-01 challenge (HTTP-01 cannot validate wildcards):
#        certbot certonly --manual --preferred-challenges dns \
#          -d newsai.<root> -d '*.newsai.<root>'
#   3. Confirm the upstream port matches NEWSAI_DJANGO_PORT (default 8001).
#   4. nginx -t  &&  systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Article django (newsai compose stack). Port must match NEWSAI_DJANGO_PORT (default 8001).
upstream newsai_django {
    server 127.0.0.1:8001;
}

# HTTP → HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name newsai.REPLACE_ROOT *.newsai.REPLACE_ROOT;

    return 301 https://$host$request_uri;
}

# HTTPS — article product vhost.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Wildcard server_name → per-tenant subdomains (tenantA.newsai.<root>, ...).
    server_name newsai.REPLACE_ROOT *.newsai.REPLACE_ROOT;

    ssl_certificate     /etc/letsencrypt/live/newsai.REPLACE_ROOT/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsai.REPLACE_ROOT/privkey.pem;

    client_max_body_size 50M;

    # ── STUDIO / SOCIAL DENY-LIST ────────────────────────────────────────────
    # ^~ prefix locations win over the generic /api/ proxy below, so these studio
    # and social endpoints are never reachable on the article product (404, no proxy).
    # NOTE: article RSS is /api/rss/ (and /api/rss/feeds/) — NOT denied. The social
    # FeedsView monitor lives at /api/feeds/ (different prefix) and IS denied.
    location ^~ /api/video/         { return 404; }   # video_studio
    location ^~ /api/pipeline/      { return 404; }   # agents (reel pipeline)
    location ^~ /api/social-studio/ { return 404; }   # cms Social Studio
    location ^~ /api/generate-post/ { return 404; }   # cms AI social post gen
    location ^~ /api/cowork/        { return 404; }   # cms Cowork
    location ^~ /api/feeds/         { return 404; }   # cms social FeedsView (X-handle monitor + handles)
    location ^~ /api/feed-categories/ { return 404; } # cms social feed-source categories
    location ^~ /api/breaking-queue/ { return 404; }  # cms Traction Queue
    location ^~ /api/system/check-twitter-health/ { return 404; }  # twitter auth health

    # ── Article API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://newsai_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Django admin ─────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://newsai_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Static files ─────────────────────────────────────────────────────────
    # MUST forward Host + X-Forwarded-Proto here too — otherwise Django's SSL
    # redirect (prod runs SECURE_SSL_REDIRECT on) loops on /static/ (the 7b bug).
    location /static/ {
        proxy_pass http://newsai_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Media files ──────────────────────────────────────────────────────────
    location /media/ {
        proxy_pass http://newsai_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Article-only React build (SPA) ───────────────────────────────────────
    root /home/ubuntu/newsai/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
